# Local development database. Production uses a managed PostgreSQL instance.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minetech
      POSTGRES_PASSWORD: minetech
      POSTGRES_DB: minetech
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minetech"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
